name: Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap-supabase-config:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 3.0.0

      - name: Generate local Supabase configuration
        run: supabase init --force

      - name: Set project identifier
        run: sed -i 's/^project_id = .*/project_id = "fixora-balance"/' supabase/config.toml

      - name: Commit configuration when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/config.toml
          if git diff --cached --quiet; then
            echo "Supabase configuration is already current."
            exit 0
          fi
          git commit -m "chore(db): add Supabase CLI project configuration"
          git push

  database:
    name: Local Supabase migrations and pgTAP
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 3.0.0

      - name: Initialize local configuration
        run: supabase init --force

      - name: Start local Supabase stack
        run: supabase start

      - name: Simulate hosted platform RLS event trigger
        run: supabase db query --file supabase/tests/fixtures/hosted_rls_event_trigger.sql

      - name: Apply project migrations to the clean local database
        run: supabase migration up

      - name: Run pgTAP tests
        run: supabase test db

  verify:
    name: TypeScript and domain tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript
        run: pnpm typecheck

      - name: Domain tests
        run: pnpm test

      - name: Android JavaScript bundle
        run: pnpm exec expo export --platform android --output-dir /tmp/fixora-balance-android

      - name: iOS JavaScript bundle
        run: pnpm exec expo export --platform ios --output-dir /tmp/fixora-balance-ios
