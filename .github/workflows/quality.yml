name: Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database:
    name: Local Supabase migrations and pgTAP
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 3.0.0

      - name: Initialize local configuration
        run: supabase init --force

      - name: Defer project migrations until hosted-platform fixture is installed
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("supabase/config.toml")
          text = path.read_text()
          start = text.index("[db.migrations]")
          end = text.find("\n[", start + 1)
          if end == -1:
              end = len(text)
          section = text[start:end]
          if "enabled = true" not in section:
              raise SystemExit("Could not find db.migrations.enabled = true")
          path.write_text(text[:start] + section.replace("enabled = true", "enabled = false", 1) + text[end:])
          PY

      - name: Start local Supabase stack
        run: supabase start -x studio,mailpit,storage-api,imgproxy,edge-runtime,analytics,vector

      - name: Enable project migrations after stack startup
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("supabase/config.toml")
          text = path.read_text()
          start = text.index("[db.migrations]")
          end = text.find("\n[", start + 1)
          if end == -1:
              end = len(text)
          section = text[start:end]
          if "enabled = false" not in section:
              raise SystemExit("Could not find db.migrations.enabled = false")
          path.write_text(text[:start] + section.replace("enabled = false", "enabled = true", 1) + text[end:])
          PY

      - name: Create local hosted RLS event-trigger function
        run: supabase db query --file supabase/fixtures/hosted_rls_event_trigger_function.sql

      - name: Register local hosted RLS event trigger
        run: supabase db query --file supabase/fixtures/hosted_rls_event_trigger_registration.sql

      - name: Apply project migrations to the clean local database
        run: supabase migration up

      - name: Run pgTAP tests
        run: supabase test db

  verify:
    name: TypeScript and domain tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript
        run: pnpm typecheck

      - name: Domain tests
        run: pnpm test

      - name: Android JavaScript bundle
        run: pnpm exec expo export --platform android --output-dir /tmp/fixora-balance-android

      - name: iOS JavaScript bundle
        run: pnpm exec expo export --platform ios --output-dir /tmp/fixora-balance-ios
