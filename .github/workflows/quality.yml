name: Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database:
    name: Local Supabase migrations and pgTAP
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13
        with:
          version: 3.0.0

      - name: Verify committed local Supabase configuration
        run: |
          test -s supabase/config.toml
          python3 - <<'PY'
          import tomllib
          from pathlib import Path
          tomllib.loads(Path("supabase/config.toml").read_text(encoding="utf-8"))
          print("Committed Supabase configuration is present and valid; preserving project-specific settings.")
          PY

      - name: Defer project migrations until hosted-platform fixture is installed
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("supabase/config.toml")
          text = path.read_text()
          start = text.index("[db.migrations]")
          end = text.find("\n[", start + 1)
          if end == -1:
              end = len(text)
          section = text[start:end]
          if "enabled = true" not in section:
              raise SystemExit("Could not find db.migrations.enabled = true")
          path.write_text(text[:start] + section.replace("enabled = true", "enabled = false", 1) + text[end:])
          PY

      - name: Start local Supabase stack
        run: supabase start -x studio,mailpit,storage-api,imgproxy,edge-runtime,analytics,vector

      - name: Enable project migrations after stack startup
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("supabase/config.toml")
          text = path.read_text()
          start = text.index("[db.migrations]")
          end = text.find("\n[", start + 1)
          if end == -1:
              end = len(text)
          section = text[start:end]
          if "enabled = false" not in section:
              raise SystemExit("Could not find db.migrations.enabled = false")
          path.write_text(text[:start] + section.replace("enabled = false", "enabled = true", 1) + text[end:])
          PY

      - name: Create local hosted RLS event-trigger function
        run: supabase db query --file supabase/fixtures/hosted_rls_event_trigger_function.sql

      - name: Register local hosted RLS event trigger
        run: supabase db query --file supabase/fixtures/hosted_rls_event_trigger_registration.sql

      - name: Apply project migrations to the clean local database
        run: supabase migration up

      - name: Run pgTAP tests
        run: supabase test db

  verify:
    name: TypeScript and domain tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.20.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Dependency security audit
        run: |
          set +e
          pnpm audit --json > "$RUNNER_TEMP/pnpm-audit.json"
          audit_status=$?
          set -e
          python3 - "$RUNNER_TEMP/pnpm-audit.json" "$audit_status" <<'PY'
          import json
          import sys
          from pathlib import Path

          report = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          audit_status = int(sys.argv[2])
          advisories = report.get("advisories")
          if not isinstance(advisories, dict):
              raise SystemExit("Unexpected pnpm audit JSON schema; security audit cannot be interpreted safely.")

          counts = report.get("metadata", {}).get("vulnerabilities", {})
          rank = {"info": 0, "low": 1, "moderate": 2, "high": 3, "critical": 4}
          blocking = []
          print("Dependency advisory report:")
          for advisory_id, advisory in sorted(advisories.items(), key=lambda item: str(item[0])):
              severity = advisory.get("severity", "unknown")
              module = advisory.get("module_name", "unknown-package")
              print(
                  f"- {severity.upper()} {module} "
                  f"(advisory {advisory_id}; affected {advisory.get('vulnerable_versions', 'unknown')}; "
                  f"patched {advisory.get('patched_versions') or 'no published fix'})"
              )
              if advisory.get("url"):
                  print(f"  reference: {advisory['url']}")
              for finding in advisory.get("findings", []):
                  print(f"  installed: {finding.get('version', 'unknown')}")
                  for path in finding.get("paths", []):
                      print(f"  dependency path: {path}")
              if rank.get(severity, 0) >= rank["high"]:
                  blocking.append(f"{severity}: {module} ({advisory_id})")

          print("Severity totals:", json.dumps(counts, sort_keys=True))
          if blocking:
              raise SystemExit("High/Critical dependency advisories found: " + "; ".join(blocking))
          if audit_status not in (0, 1):
              raise SystemExit(f"pnpm audit failed unexpectedly with exit code {audit_status}")
          if audit_status == 1 and not advisories:
              raise SystemExit("pnpm audit returned failure without a parseable advisory; fail closed.")
          print("No High/Critical advisories. Lower-severity findings are reported for explicit triage.")
          PY

      - name: Expo Doctor
        run: pnpm dlx expo-doctor@1.21.6

      - name: Validate EAS build profiles
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          config = json.loads(Path("eas.json").read_text())
          profiles = config["build"]
          assert profiles["preview"]["distribution"] == "internal"
          assert profiles["preview"]["android"]["buildType"] == "apk"
          assert profiles["ios-simulator"]["ios"]["simulator"] is True
          assert profiles["production"]["autoIncrement"] is True
          print("EAS preview, iOS simulator, and production profiles are valid")
          PY

      - name: Resolve Expo app configuration without account credentials
        run: |
          pnpm exec expo config --type public --json > "$RUNNER_TEMP/expo-public-config.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          config = json.loads((Path(os.environ["RUNNER_TEMP"]) / "expo-public-config.json").read_text())
          assert config["slug"] == "fixora-balance"
          assert config["scheme"] == "fixorabal"
          assert config["ios"]["bundleIdentifier"] == "com.fixoradynamics.balance"
          assert config["android"]["package"] == "com.fixoradynamics.balance"
          print("Expo public app configuration is valid")
          PY

      - name: Validate local Supabase Auth security defaults
        run: python3 scripts/test-supabase-auth-config.py

      - name: TypeScript
        run: pnpm typecheck

      - name: Domain tests
        run: pnpm test

      - name: Local SQLite schema smoke tests
        run: python3 scripts/test-local-sqlite-schema.py

      - name: Android JavaScript bundle
        run: pnpm exec expo export --platform android --output-dir /tmp/fixora-balance-android

      - name: iOS JavaScript bundle
        run: pnpm exec expo export --platform ios --output-dir /tmp/fixora-balance-ios
