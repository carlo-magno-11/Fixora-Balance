name: Android QA Build

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/android-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-release-qa-apk:
    name: Android release QA APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.20.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: "17"

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Accept Android SDK licenses in ephemeral CI runner
        run: |
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          sdkmanager_status=${PIPESTATUS[1]}
          set -o pipefail
          exit "$sdkmanager_status"

      - name: Install Android SDK 37.0 preview, build tools, and NDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --channel=3 "platform-tools" "platforms;android-37.0" "build-tools;37.0.0" "ndk;27.1.12297006" "emulator" "system-images;android-36;google_apis;x86_64"

      - name: Generate Android native project
        run: pnpm exec expo prebuild --platform android --no-install

      - name: Build release QA APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Verify Android release QA APK
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/37.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.fixoradynamics.balance'"

      - name: Create Android QA emulator
        run: |
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --force --name fixora-qa --package "system-images;android-36;google_apis;x86_64" --device "pixel_2"

      - name: Boot Android emulator
        run: |
          "$ANDROID_HOME/emulator/emulator" -avd fixora-qa -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -wipe-data > "$RUNNER_TEMP/fixora-emulator.log" 2>&1 &
          timeout 300 adb wait-for-device
          for attempt in $(seq 1 90); do
            if [ "$(adb shell getprop sys.boot_completed | tr -d '\\r')" = "1" ]; then
              break
            fi
            sleep 5
          done
          test "$(adb shell getprop sys.boot_completed | tr -d '\\r')" = "1"
          adb shell input keyevent 82

      - name: Install, launch, and capture Android app
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          adb logcat -c
          adb install -r "$APK"
          adb shell monkey -p com.fixoradynamics.balance 1
          sleep 12
          if ! adb shell pidof com.fixoradynamics.balance; then
            adb logcat -d -t 3000
            exit 1
          fi
          if adb logcat -d -t 3000 | grep -E "No script URL provided|Unable to load script|FATAL EXCEPTION|ReactNativeJS.*(Error|Exception)"; then
            exit 1
          fi
          adb shell screencap -p /sdcard/fixora-home-android.png
          adb pull /sdcard/fixora-home-android.png "$RUNNER_TEMP/fixora-home-android.png"
          test -s "$RUNNER_TEMP/fixora-home-android.png"

      - name: Upload Android QA APK and first screen
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fixora-balance-android-release-qa
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            ${{ runner.temp }}/fixora-home-android.png
          if-no-files-found: error
          retention-days: 14
