name: Native QA Builds

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "src/**"
      - "app.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - "eas.json"
      - ".github/workflows/native-builds.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-debug-apk:
    name: Android debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.20.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Android SDK 37 and NDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-37" "build-tools;37.0.0" "ndk;27.1.12297006"

      - name: Generate Android native project
        run: pnpm exec expo prebuild --platform android --no-install

      - name: Build debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Verify APK artifact
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Android QA APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fixora-balance-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  ios-simulator-app:
    name: iOS Simulator app
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Verify Xcode toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks
          xcodebuild -version | grep -E "Xcode 2[6-9]"

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.20.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate iOS native project
        run: pnpm exec expo prebuild --platform ios --no-install

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install

      - name: Resolve workspace and scheme
        id: xcode
        run: |
          WORKSPACE="$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)"
          test -n "$WORKSPACE"
          xcodebuild -list -json -workspace "$WORKSPACE" > "$RUNNER_TEMP/xcode-project.json"
          SCHEME="$(python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); print(d["workspace"]["schemes"][0])' "$RUNNER_TEMP/xcode-project.json")"
          test -n "$SCHEME"
          echo "workspace=$WORKSPACE" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"

      - name: Build iOS Simulator app
        run: |
          xcodebuild \
            -workspace "${{ steps.xcode.outputs.workspace }}" \
            -scheme "${{ steps.xcode.outputs.scheme }}" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$RUNNER_TEMP/FixoraDerivedData" \
            CODE_SIGNING_ALLOWED=NO

      - name: Verify iOS Simulator app artifact
        run: |
          APP_PATH="$(find "$RUNNER_TEMP/FixoraDerivedData/Build/Products/Debug-iphonesimulator" -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          ditto "$APP_PATH" "$RUNNER_TEMP/FixoraBalance-iOS-Simulator.app"

      - name: Upload iOS Simulator app
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fixora-balance-ios-simulator-app
          path: ${{ runner.temp }}/FixoraBalance-iOS-Simulator.app
          if-no-files-found: error
          retention-days: 14
