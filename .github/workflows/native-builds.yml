name: Native QA Builds

on:
  pull_request:
    paths:
      - "app/**"
      - "src/**"
      - "app.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - "eas.json"
      - ".github/workflows/native-builds.yml"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "src/**"
      - "app.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - "eas.json"
      - ".github/workflows/native-builds.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-debug-apk:
    name: Android release QA APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.20.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Gradle dependency cache
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c
        with:
          cache-provider: basic

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Accept Android SDK licenses in ephemeral CI runner
        run: |
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          sdkmanager_status=${PIPESTATUS[1]}
          set -o pipefail
          exit "$sdkmanager_status"

      - name: Install Android SDK 37.0 preview, build tools, and NDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --channel=3 "platform-tools" "platforms;android-37.0" "build-tools;37.0.0" "ndk;27.1.12297006"

      - name: Generate Android native project
        run: pnpm exec expo prebuild --platform android --no-install

      - name: Build release QA APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Verify Android release QA APK
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/37.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.fixoradynamics.balance'"

      - name: Upload Android QA APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fixora-balance-android-release-qa-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

  ios-simulator-app:
    name: iOS Simulator app
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Verify Xcode toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks
          xcodebuild -version | grep -E "Xcode 2[6-9]"

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.20.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate iOS native project
        run: pnpm exec expo prebuild --platform ios --no-install

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install

      - name: Resolve workspace and scheme
        id: xcode
        run: |
          WORKSPACE="$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)"
          test -n "$WORKSPACE"
          xcodebuild -list -json -workspace "$WORKSPACE" > "$RUNNER_TEMP/xcode-project.json"
          SCHEME="$(python3 - "$RUNNER_TEMP/xcode-project.json" "$WORKSPACE" <<'PY'
          import json
          import sys
          from pathlib import Path
          data = json.loads(Path(sys.argv[1]).read_text())
          available = data["workspace"]["schemes"]
          expected = Path(sys.argv[2]).stem
          matches = [name for name in available if name.casefold() == expected.casefold()]
          if not matches:
              print(f"Expected app scheme {expected!r}; available schemes: {available}", file=sys.stderr)
              raise SystemExit(1)
          print(matches[0])
          PY
          )"
          test -n "$SCHEME"
          echo "Resolved app scheme: $SCHEME"
          echo "workspace=$WORKSPACE" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"

      - name: Build iOS Simulator app
        run: |
          xcodebuild \
            -workspace "${{ steps.xcode.outputs.workspace }}" \
            -scheme "${{ steps.xcode.outputs.scheme }}" \
            -configuration Release \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$RUNNER_TEMP/FixoraDerivedData" \
            CODE_SIGNING_ALLOWED=NO

      - name: Verify iOS Simulator app artifact
        run: |
          APP_PATH="$(find "$RUNNER_TEMP/FixoraDerivedData/Build/Products/Release-iphonesimulator" -maxdepth 4 -type d -name '*.app' -print -quit)"
          if [ -z "$APP_PATH" ]; then
            find "$RUNNER_TEMP/FixoraDerivedData/Build/Products/Release-iphonesimulator" -maxdepth 4 -print
            exit 1
          fi
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist")
          test "$BUNDLE_ID" = "com.fixoradynamics.balance"
          test -s "$APP_PATH/main.jsbundle"
          ditto "$APP_PATH" "$RUNNER_TEMP/FixoraBalance-iOS-Simulator.app"

      - name: Launch app on iOS Simulator and capture screen
        run: |
          DEVICE_ID="$(xcrun simctl list devices available --json | python3 -c 'import json,sys; d=json.load(sys.stdin); devices=[x for group in d["devices"].values() for x in group if x.get("isAvailable") and x["name"].startswith("iPhone")]; print(next((x["udid"] for x in devices if x["state"] == "Booted"), devices[0]["udid"] if devices else ""))')"
          test -n "$DEVICE_ID"
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl install "$DEVICE_ID" "$RUNNER_TEMP/FixoraBalance-iOS-Simulator.app"
          xcrun simctl launch "$DEVICE_ID" com.fixoradynamics.balance
          sleep 8
          xcrun simctl io "$DEVICE_ID" screenshot "$RUNNER_TEMP/fixora-home-ios.png"
          test -s "$RUNNER_TEMP/fixora-home-ios.png"

      - name: Upload iOS Simulator app and first screen
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fixora-balance-ios-simulator-qa
          path: |
            ${{ runner.temp }}/FixoraBalance-iOS-Simulator.app
            ${{ runner.temp }}/fixora-home-ios.png
          if-no-files-found: error
          retention-days: 14
